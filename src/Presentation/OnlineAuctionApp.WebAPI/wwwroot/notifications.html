<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
  <title data-i18n="notifications_title">Bildirişlər | BidVerse</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
      };
    </script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body class="bg-slate-50 dark:bg-slate-900 text-gray-900 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300">
    <div id="navbar-container"></div>

    <main class="max-w-4xl mx-auto px-4 py-8 flex-1 w-full">
      <h1 class="text-2xl font-black text-gray-900 dark:text-white mb-6" data-i18n="notifications_title">Bildirişləriniz</h1>
      <div id="notifications-list" class="space-y-3"></div>
    </main>
    <div id="footer-container"></div>
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/common.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@latest/dist/browser/signalr.min.js"></script>
    <script src="assets/js/notifications.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        await Auth.requireAuth();
        try {
          const list = await API.get("/api/Notifications/my");
          const container = document.getElementById("notifications-list");
          if (list.length === 0) {
            container.innerHTML = `<div class="p-8 text-center bg-white dark:bg-slate-800 rounded-2xl text-gray-400 dark:text-gray-500" data-i18n="notifications_empty">Bildirişiniz yoxdur.</div>`;
            return;
          }
          container.innerHTML = list
            .map(
              (n) => `
                    <div class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-gray-100 dark:border-slate-700 flex justify-between items-center transition-colors duration-300 ${!n.isRead ? "border-l-4 border-l-indigo-600 bg-indigo-50/20 dark:bg-indigo-900/20" : ""}">
                        <p class="text-sm text-gray-800 dark:text-gray-200 font-medium">${n.message}</p>
                        ${
                          !n.isRead
                            ? `
                            <button onclick="markRead('${n.id}')" class="text-xs bg-indigo-50 dark:bg-indigo-900/40 text-indigo-600 dark:text-indigo-400 px-3 py-1 rounded-lg hover:bg-indigo-100 dark:hover:bg-indigo-900/60 font-semibold" data-i18n="notifications_mark_read">Oxundu İşarələ</button>
                        `
                            : '<span class="text-xs text-gray-400 dark:text-gray-500" data-i18n="notifications_read">Oxunub</span>'
                        }
                    </div>
                `,
            )
            .join("");

          if (typeof I18n !== 'undefined') I18n.apply();
        } catch (err) {
          Common.showToast(err.errors);
        }
      });

      async function markRead(id) {
        try {
          await API.patch(`/api/Notifications/${id}/read`);
          window.location.reload();
        } catch (e) {
          console.error(e);
        }
      }
    </script>
  </body>
</html>
