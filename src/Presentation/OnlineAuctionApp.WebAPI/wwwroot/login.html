<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <title data-i18n="login_title">Daxil Ol | BidVerse</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
      };
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-900 text-gray-900 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300">
    <div id="navbar-container"></div>

    <main class="flex-1 flex items-center justify-center w-full px-4 py-8">
      <div
        class="bg-white dark:bg-slate-800 p-8 rounded-2xl border border-gray-100 dark:border-slate-700 shadow-xl max-w-md w-full space-y-6 transition-colors duration-300"
      >
        <div class="text-center">
          <h1 class="text-2xl font-black text-gray-900 dark:text-white" data-i18n="login_title">
            BidVerse-ə Giriş
          </h1>
          <p class="text-xs text-gray-400 dark:text-gray-500 mt-1" data-i18n="login_subtitle">
            Davam etmək üçün hesabınıza daxil olun
          </p>
        </div>
        <form id="login-form" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1" data-i18n="login_username_label"
              >İstifadəçi adı və ya Email</label
            >
            <input
              type="text"
              id="usernameOrEmail"
              required
              class="w-full border border-gray-200 dark:border-gray-600 dark:bg-slate-700 dark:text-white rounded-xl px-4 py-3 text-sm focus:outline-indigo-600"
            />
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1" data-i18n="login_password_label"
              >Şifrə</label
            >
            <input
              type="password"
              id="password"
              required
              class="w-full border border-gray-200 dark:border-gray-600 dark:bg-slate-700 dark:text-white rounded-xl px-4 py-3 text-sm focus:outline-indigo-600"
            />
          </div>
          <button
            type="submit"
            class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700 transition"
            data-i18n="login_btn"
          >
            Daxil Ol
          </button>
        </form>
        <p class="text-center text-xs text-gray-500 dark:text-gray-400">
          <span data-i18n="login_no_account">Hesabınız yoxdur?</span>
          <a
            href="register.html"
            class="text-indigo-600 font-bold hover:underline"
            data-i18n="login_register_link"
            >Qeydiyyatdan keçin</a
          >
        </p>
      </div>
    </main>

    <div id="footer-container"></div>

    <script src="assets/js/theme.js"></script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/common.js"></script>
    <script>
      document
        .getElementById("login-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          try {
            const user = await Auth.login(
              document.getElementById("usernameOrEmail").value,
              document.getElementById("password").value,
            );
            if (Auth.hasRole("Admin"))
              window.location.href = "admin-dashboard.html";
            else if (Auth.hasRole("Seller"))
              window.location.href = "seller-dashboard.html";
            else window.location.href = "auctions.html";
          } catch (err) {
            Common.showToast(
              err.errors || "Giriş zamanı xəta baş verdi",
              "error",
            );
          }
        });
    </script>
  </body>
</html>
