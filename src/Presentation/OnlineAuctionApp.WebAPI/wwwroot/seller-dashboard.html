<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
  <title data-i18n="seller_title">Satıcı Paneli | BidVerse</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
      };
    </script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body class="bg-slate-50 dark:bg-slate-900 text-gray-900 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300">
    <div id="navbar-container"></div>

    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
      <div class="flex justify-between items-center mb-8">
        <h1 class="text-2xl font-black text-gray-900 dark:text-white" data-i18n="seller_title">Satıcı Paneli</h1>
        <button
          onclick="
            document.getElementById('create-modal').classList.remove('hidden')
          "
          class="bg-indigo-600 text-white font-medium px-5 py-2.5 rounded-xl hover:bg-indigo-700 transition"
        >
          <i class="fa-solid fa-plus mr-2"></i> <span data-i18n="seller_new_auction">Yeni Hərrac Yarat</span>
        </button>
      </div>

      <!-- Summary Cards -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-gray-100 dark:border-slate-700 shadow-sm transition-colors duration-300">
          <span class="text-xs text-gray-400 dark:text-gray-500 font-medium block" data-i18n="seller_total"
            >Ümumi Hərraclar</span
          >
          <span id="stat-total" class="text-3xl font-black text-gray-900 dark:text-white"
            >0</span
          >
        </div>
        <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-gray-100 dark:border-slate-700 shadow-sm transition-colors duration-300">
          <span class="text-xs text-gray-400 dark:text-gray-500 font-medium block" data-i18n="seller_active"
            >Aktiv Hərraclar</span
          >
          <span id="stat-active" class="text-3xl font-black text-emerald-600"
            >0</span
          >
        </div>
        <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-gray-100 dark:border-slate-700 shadow-sm transition-colors duration-300">
          <span class="text-xs text-gray-400 dark:text-gray-500 font-medium block" data-i18n="seller_completed"
            >Bitmiş Hərraclar</span
          >
          <span id="stat-completed" class="text-3xl font-black text-indigo-600"
            >0</span
          >
        </div>
      </div>

      <!-- Auctions Table -->
      <div
        class="bg-white dark:bg-slate-800 rounded-2xl border border-gray-100 dark:border-slate-700 shadow-sm overflow-hidden transition-colors duration-300"
      >
        <div class="p-6 border-b border-gray-100 dark:border-slate-700">
          <h3 class="font-bold text-gray-900 dark:text-white" data-i18n="seller_my_auctions">Mənim Hərraclarım</h3>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="bg-gray-50 dark:bg-slate-700/50 text-gray-400 uppercase text-xs">
              <tr>
                <th class="py-3 px-4" data-i18n="seller_table_product">Məhsul</th>
                <th class="py-3 px-4" data-i18n="seller_table_price">Cari Qiymət</th>
                <th class="py-3 px-4" data-i18n="seller_table_status">Status</th>
                <th class="py-3 px-4" data-i18n="seller_table_end">Bitiş Vaxtı</th>
                <th class="py-3 px-4 text-right" data-i18n="seller_table_actions">Əməliyyatlar</th>
              </tr>
            </thead>
            <tbody id="seller-auctions-table"></tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- Create Modal -->
    <div
      id="create-modal"
      class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4"
    >
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 max-w-lg w-full space-y-4">
        <div class="flex justify-between items-center border-b dark:border-slate-700 pb-3">
          <h3 class="font-bold text-lg dark:text-white" data-i18n="seller_create_title">Yeni Hərrac Yaradın</h3>
          <button
            onclick="
              document.getElementById('create-modal').classList.add('hidden')
            "
            class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300"
          >
            &times;
          </button>
        </div>
        <form onsubmit="SellerDashboard.createAuction(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1" data-i18n="create_title_label"
              >Başlıq</label
            >
            <input
              type="text"
              id="create-title"
              required
              class="w-full border border-gray-200 dark:border-gray-600 dark:bg-slate-700 dark:text-white rounded-xl px-4 py-2 text-sm"
            />
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1" data-i18n="create_desc_label"
              >Təsvir</label
            >
            <textarea
              id="create-description"
              required
              class="w-full border border-gray-200 dark:border-gray-600 dark:bg-slate-700 dark:text-white rounded-xl px-4 py-2 text-sm"
            ></textarea>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1" data-i18n="create_price_label"
                >Başlanğıc Qiyməti</label
              >
              <input
                type="number"
                id="create-price"
                required
                class="w-full border border-gray-200 dark:border-gray-600 dark:bg-slate-700 dark:text-white rounded-xl px-4 py-2 text-sm"
              />
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1" data-i18n="create_category_label"
                >Kategoriya</label
              >
              <select
                id="create-category"
                required
                class="w-full border border-gray-200 dark:border-gray-600 dark:bg-slate-700 dark:text-white rounded-xl px-4 py-2 text-sm"
              ></select>
            </div>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1" data-i18n="create_endtime_label"
              >Bitiş Vaxtı</label
            >
            <input
              type="datetime-local"
              id="create-endtime"
              required
              class="w-full border border-gray-200 dark:border-gray-600 dark:bg-slate-700 dark:text-white rounded-xl px-4 py-2 text-sm"
            />
          </div>
          <button
            type="submit"
            class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700 transition"
            data-i18n="seller_create_btn"
          >
            Yarat
          </button>
        </form>
      </div>
    </div>

    <!-- Upload Image Modal -->
    <div
      id="image-modal"
      class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4"
    >
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 max-w-md w-full space-y-4">
        <h3 class="font-bold text-lg dark:text-white" data-i18n="seller_upload_title">Şəkil Yüklə</h3>
        <form onsubmit="SellerDashboard.uploadImage(event)" class="space-y-4">
          <input type="hidden" id="upload-auction-id" />
          <input
            type="file"
            id="image-file"
            accept="image/*"
            required
            class="w-full text-sm dark:text-white"
          />
          <div class="flex justify-end space-x-2">
            <button
              type="button"
              onclick="
                document.getElementById('image-modal').classList.add('hidden')
              "
              class="px-4 py-2 border border-gray-200 dark:border-gray-600 dark:text-gray-300 rounded-xl text-sm"
              data-i18n="seller_cancel_btn"
            >
              Ləğv et
            </button>
            <button
              type="submit"
              class="px-4 py-2 bg-indigo-600 text-white font-bold rounded-xl text-sm"
              data-i18n="seller_upload_btn"
            >
              Yüklə
            </button>
          </div>
        </form>
      </div>
    </div>
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/common.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@latest/dist/browser/signalr.min.js"></script>
    <script src="assets/js/notifications.js"></script>
    <script src="assets/js/seller-dashboard.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () =>
        SellerDashboard.init(),
      );
    </script>
  </body>
</html>
