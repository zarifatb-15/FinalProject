<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
  <title data-i18n="categories_title">Kategoriyalar | BidVerse</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
      };
    </script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body class="bg-slate-50 dark:bg-slate-900 text-gray-900 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300">
    <div id="navbar-container"></div>

    <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
        <!-- Form -->
        <div
          class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-gray-100 dark:border-slate-700 shadow-sm h-fit transition-colors duration-300"
        >
          <h3 class="font-bold text-lg dark:text-white mb-4" data-i18n="categories_new">Yeni Kategoriya</h3>
          <form
            id="cat-form"
            onsubmit="CategoriesPage.createCategory(event)"
            class="space-y-4"
          >
            <div>
              <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1" data-i18n="categories_name"
                >Adı</label
              >
              <input
                type="text"
                id="cat-name"
                required
                class="w-full border border-gray-200 dark:border-gray-600 dark:bg-slate-700 dark:text-white rounded-xl px-4 py-2 text-sm"
              />
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1" data-i18n="categories_desc"
                >Təsviri</label
              >
              <textarea
                id="cat-desc"
                class="w-full border border-gray-200 dark:border-gray-600 dark:bg-slate-700 dark:text-white rounded-xl px-4 py-2 text-sm"
              ></textarea>
            </div>
            <button
              type="submit"
              class="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-xl hover:bg-indigo-700 transition"
              data-i18n="categories_add"
            >
              Əlavə Et
            </button>
          </form>
        </div>

        <!-- List -->
        <div
          class="md:col-span-2 bg-white dark:bg-slate-800 rounded-2xl border border-gray-100 dark:border-slate-700 shadow-sm p-6 transition-colors duration-300"
        >
          <h3 class="font-bold text-lg dark:text-white mb-4" data-i18n="categories_existing">Mövcud Kategoriyalar</h3>
          <table class="w-full text-left text-sm">
            <thead class="bg-gray-50 dark:bg-slate-700/50 text-xs text-gray-400">
              <tr>
                <th class="py-3 px-4" data-i18n="categories_table_name">Ad</th>
                <th class="py-3 px-4" data-i18n="categories_table_desc">Təsvir</th>
                <th class="py-3 px-4 text-right" data-i18n="categories_table_action">Əməl</th>
              </tr>
            </thead>
            <tbody id="categories-table"></tbody>
          </table>
        </div>
      </div>
    </main>
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/common.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@latest/dist/browser/signalr.min.js"></script>
    <script src="assets/js/notifications.js"></script>
    <script src="assets/js/categories.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () =>
        CategoriesPage.init(),
      );
    </script>
  </body>
</html>
