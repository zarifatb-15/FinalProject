<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auction Details | Online Auction</title>
    <link rel="stylesheet" href="/assets/css/style.css" />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
  </head>
  <body>
    <header class="navbar">
      <div class="nav-shell">
        <a href="/index.html" class="brand">
          <span class="brand-mark">A</span>
          <span>
            <strong>Online Auction</strong>
            <small>Live bidding marketplace</small>
          </span>
        </a>

        <nav class="nav-links">
          <a href="/auctions.html">Auctions</a>
          <a
            href="/seller-dashboard.html"
            id="sellerDashboardLink"
            class="hidden"
            >Seller Dashboard</a
          >
          <a href="/login.html" id="loginLink">Login</a>
          <a
            href="/register.html"
            id="registerLink"
            class="btn btn-small btn-outline"
            >Register</a
          >
          <button id="logoutButton" class="btn btn-small btn-outline hidden">
            Logout
          </button>
        </nav>
      </div>
    </header>

    <main class="page" x-data="auctionDetailsPage()" x-init="init()" x-cloak>
      <template x-if="loading">
        <p class="message">Loading auction details...</p>
      </template>

      <template x-if="error">
        <section class="empty-state">
          <h1>Something went wrong</h1>
          <p x-text="error"></p>
          <a href="/auctions.html" class="btn btn-primary">Back to Auctions</a>
        </section>
      </template>

      <template x-if="auction && !loading && !error">
        <div>
          <section class="details-header">
            <div>
              <a href="/auctions.html" class="back-link">← Back to auctions</a>
              <span class="eyebrow" x-text="auction.categoryName"></span>
              <h1 x-text="auction.title"></h1>
              <p x-text="auction.description"></p>
            </div>

            <div class="status-card">
              <span>Status</span>
              <strong x-text="auction.status"></strong>
            </div>
          </section>

          <section class="details-layout">
            <div class="details-main-card">
              <div class="details-image">
                <template x-if="mainImageUrl">
                  <img :src="mainImageUrl" :alt="auction.title" />
                </template>

                <template x-if="!mainImageUrl">
                  <span>No image uploaded</span>
                </template>
              </div>

              <div class="details-info-grid">
                <div>
                  <span class="muted">Starting Price</span>
                  <strong
                    x-text="formatPriceValue(auction.startingPrice)"
                  ></strong>
                </div>

                <div>
                  <span class="muted">Current Bid</span>
                  <strong
                    class="highlight-price"
                    x-text="formatPriceValue(auction.currentPrice)"
                  ></strong>
                </div>

                <div>
                  <span class="muted">Deadline</span>
                  <strong x-text="formatDateValue(auction.endTime)"></strong>
                </div>

                <div>
                  <span class="muted">Time Left</span>
                  <strong
                    class="countdown-large"
                    x-text="countdownText"
                  ></strong>
                </div>
              </div>
            </div>

            <aside class="bid-panel">
              <h2>Place a bid</h2>

              <template x-if="!user">
                <div class="notice-box">
                  <p>You need to login as a buyer to place a bid.</p>
                  <a href="/login.html" class="btn btn-primary full-width"
                    >Login to Bid</a
                  >
                </div>
              </template>

              <template x-if="user && !isBuyer">
                <div class="notice-box">
                  <p>Only buyer accounts can place bids.</p>
                </div>
              </template>

              <template x-if="user && isBuyer && auction.status !== 'Active'">
                <div class="notice-box">
                  <p>This auction is already closed.</p>
                </div>
              </template>

              <template x-if="user && isBuyer && auction.status === 'Active'">
                <form class="form" @submit.prevent="placeBid">
                  <label>
                    Your Bid Amount
                    <input
                      type="number"
                      min="1"
                      step="0.01"
                      x-model="bidAmount"
                      :placeholder="minimumBidPlaceholder"
                      required
                    />
                  </label>

                  <button
                    type="submit"
                    class="btn btn-primary full-width"
                    :disabled="bidSubmitting"
                  >
                    <span
                      x-text="bidSubmitting ? 'Placing bid...' : 'Place Bid'"
                    ></span>
                  </button>
                </form>
              </template>

              <p
                class="message success"
                x-show="successMessage"
                x-text="successMessage"
              ></p>
              <p class="message error" x-show="bidError" x-text="bidError"></p>
            </aside>
          </section>

          <section class="history-section">
            <div class="section-heading">
              <span class="eyebrow">Bid History</span>
              <h2>Transparent bidding activity</h2>
              <p>
                All bids for this auction are visible for a clear and auditable
                process.
              </p>
            </div>

            <div class="history-card">
              <template x-if="bids.length === 0">
                <div class="empty-bid-history">
                  <div class="empty-bid-icon">⌛</div>
                  <h3>No bids yet</h3>
                  <p>
                    No bids have been placed yet. The first valid bid will
                    appear here.
                  </p>
                </div>
              </template>

              <template x-if="bids.length > 0">
                <table class="history-table">
                  <thead>
                    <tr>
                      <th>Buyer</th>
                      <th>Amount</th>
                      <th>Bid Time</th>
                    </tr>
                  </thead>

                  <tbody>
                    <template x-for="bid in bids" :key="bid.id">
                      <tr>
                        <td x-text="bid.buyerUsername"></td>
                        <td x-text="formatPriceValue(bid.amount)"></td>
                        <td x-text="formatDateValue(bid.bidTime)"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </template>
            </div>
          </section>
        </div>
      </template>
    </main>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/layout.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/auction-details.js"></script>
  </body>
</html>
