<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
  <title data-i18n="nav_auctions">Hərraclar | BidVerse</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
      };
    </script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body class="bg-slate-50 dark:bg-slate-900 text-gray-900 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300">
    <div id="navbar-container"></div>

    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
      <!-- Filter Bar -->
      <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-gray-100 dark:border-slate-700 shadow-sm mb-8 transition-colors duration-300">
        <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
          <input
            type="text"
            id="search-input"
            data-i18n-placeholder="filter_search"
            placeholder="Məhsul axtar..."
            class="border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-indigo-600"
          />
          <select
            id="category-filter"
            class="border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-indigo-600"
          >
            <option value="" data-i18n="filter_cat">Bütün Kategoriyalar</option>
          </select>
          <input
            type="number"
            id="min-price"
            data-i18n-placeholder="filter_min"
            placeholder="Min Qiymət"
            class="border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-indigo-600"
          />
          <input
            type="number"
            id="max-price"
            data-i18n-placeholder="filter_max"
            placeholder="Max Qiymət"
            class="border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-indigo-600"
          />
          <button
            onclick="AuctionsPage.loadAuctions()"
            class="bg-indigo-600 text-white font-medium rounded-xl py-2.5 hover:bg-indigo-700 transition"
          >
            <i class="fa-solid fa-filter mr-2"></i> <span data-i18n="filter_btn">Filterlə</span>
          </button>
        </div>
      </div>

      <div
        id="auctions-grid"
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"
      ></div>
    </main>
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/common.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@latest/dist/browser/signalr.min.js"></script>
    <script src="assets/js/notifications.js"></script>
    <script src="assets/js/auctions.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => AuctionsPage.init());
    </script>
  </body>
</html>
