<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auctions | Online Auction</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
    <header class="navbar">
    <div class="nav-shell">
        <a href="/index.html" class="brand">
            <span class="brand-mark">A</span>
            <span>
                <strong>Online Auction</strong>
                <small>Live bidding marketplace</small>
            </span>
        </a>

        <nav class="nav-links">
            <a href="/auctions.html">Auctions</a>
            <a href="/seller-dashboard.html" id="sellerDashboardLink" class="hidden">Seller Dashboard</a>
            <a href="/login.html" id="loginLink">Login</a>
            <a href="/register.html" id="registerLink" class="btn btn-small btn-outline">Register</a>
            <button id="logoutButton" class="btn btn-small btn-outline hidden">Logout</button>
        </nav>
    </div>
</header>

    <main class="page">
        <section class="page-header">
            <div>
                <span class="eyebrow">Marketplace</span>
                <h1>Active Auctions</h1>
                <p>Search active listings by category, keyword and price range.</p>
            </div>
        </section>

        <section class="filter-panel">
            <form id="auctionFilterForm" class="filter-form">
                <input type="text" id="searchInput" placeholder="Search by title, description or category">

                <select id="categorySelect">
                    <option value="">All categories</option>
                </select>

                <input type="number" id="minPriceInput" min="0" placeholder="Min price">
                <input type="number" id="maxPriceInput" min="1" placeholder="Max price">

                <button type="submit" class="btn btn-primary">Apply Filters</button>
                <button type="button" id="clearFiltersButton" class="btn btn-secondary">Clear</button>
            </form>
        </section>

        <p id="auctionMessage" class="message"></p>

        <section id="auctionGrid" class="auction-grid"></section>
    </main>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/auctions.js"></script>
</body>
</html>
